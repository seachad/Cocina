<title>Recetario Socarrat</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chivo+Mono:wght@400;600&family=Shrikhand&display=swap">
<style>
:root {
  color-scheme: dark;
  --mar-900:#071722; --mar-800:#0C2433; --mar-700:#123247; --mar-500:#2B5A73;
  --hierro:#1C1917; --hierro-borde:#3A332E;
  --azafran:#F4A81D; --azafran-claro:#FFD27A;
  --bogavante:#E2492F; --coral:#FF7A59;
  --oliva:#A7B84A;
  --espuma:#EEF4F1; --niebla:#A9BFC8;
  --fuente-display:'Shrikhand', Georgia, serif;
  --fuente-texto:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --fuente-num:'Chivo Mono', ui-monospace, 'Cascadia Mono', monospace;
  --t-hero:clamp(56px, 17vw, 128px); --t-h1:clamp(36px, 9vw, 64px); --t-h2:clamp(26px, 6vw, 36px);
  --t-cuerpo:clamp(18px, 4.6vw, 20px); --t-peq:16px;
  --gutter:clamp(16px, 5vw, 32px); --ancho:1080px; --lectura:760px;
  --toque:56px; --toque-grande:72px;
  --radio-s:12px; --radio-m:20px; --radio-l:32px;
  --sombra:0 18px 40px -18px rgba(0,0,0,.65);
  --ease-salida:cubic-bezier(.2,.8,.2,1); --ease-rebote:cubic-bezier(.34,1.56,.64,1);
}
html, body { background:var(--mar-900); color:var(--espuma); }
body { margin:0; font:400 var(--t-cuerpo)/1.55 var(--fuente-texto); overflow-x:hidden; -webkit-text-size-adjust:100%; }
*, *::before, *::after { box-sizing:border-box; }
[hidden] { display:none !important; }
button { font:inherit; color:inherit; cursor:pointer; }
a { color:inherit; }
h1, h2, h3, p { margin:0; }
svg { max-width:100%; }
:focus-visible { outline:3px solid var(--azafran-claro); outline-offset:3px; }

/* ---------- Fondo ---------- */
.fondo { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  background:
    radial-gradient(circle at 90% 0%, rgba(244,168,29,.12), transparent 55%),
    radial-gradient(circle at 5% 100%, rgba(43,90,115,.45), transparent 60%),
    var(--mar-900); }
.fondo::before, .fondo::after { content:""; position:absolute; border-radius:50%; border:1px solid rgba(238,244,241,.12);
  width:8px; height:8px; left:12%; bottom:-20px; animation:burbuja 18s linear infinite; }
.fondo::after { width:5px; height:5px; left:68%; animation-duration:24s; animation-delay:-9s; }
.burbuja { position:absolute; bottom:-20px; border-radius:50%; border:1px solid rgba(238,244,241,.12); animation:burbuja 20s linear infinite; }
.burbuja:nth-child(1){ left:5%; width:6px; height:6px; animation-duration:16s; animation-delay:-3s; }
.burbuja:nth-child(2){ left:24%; width:10px; height:10px; animation-duration:24s; animation-delay:-11s; }
.burbuja:nth-child(3){ left:41%; width:4px; height:4px; animation-duration:14s; animation-delay:-6s; }
.burbuja:nth-child(4){ left:57%; width:8px; height:8px; animation-duration:22s; animation-delay:-15s; }
.burbuja:nth-child(5){ left:79%; width:5px; height:5px; animation-duration:26s; animation-delay:-2s; }
.burbuja:nth-child(6){ left:92%; width:9px; height:9px; animation-duration:19s; animation-delay:-8s; }
@keyframes burbuja { from { transform:translateY(0); opacity:0; } 10% { opacity:1; } to { transform:translateY(-110vh); opacity:0; } }

#app { position:relative; z-index:1; display:block; outline:none; min-height:100vh; }

/* ---------- Animaciones ---------- */
@keyframes subir { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:none; } }
@keyframes subir-escala { from { opacity:0; transform:translateY(24px) scale(.9); } to { opacity:1; transform:none; } }
@keyframes vapor { 0% { transform:translateY(0); opacity:0; } 35% { opacity:.6; } 100% { transform:translateY(-28px); opacity:0; } }
@keyframes entrar-vista { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
@keyframes rueda-arriba { from { transform:translateY(60%); opacity:0; } to { transform:none; opacity:1; } }
@keyframes rueda-abajo { from { transform:translateY(-60%); opacity:0; } to { transform:none; opacity:1; } }
@keyframes entrar-paso { from { opacity:0; transform:translateX(24px); } to { opacity:1; transform:none; } }
@keyframes giro { to { transform:rotate(270deg); } }
@keyframes giro-manual { from { transform:rotate(-90deg); } to { transform:rotate(270deg); } }
@keyframes pulso { 0%,100% { transform:scale(1); } 50% { transform:scale(1.03); } }
@keyframes parpadeo { 0%,100% { opacity:1; } 50% { opacity:.45; } }
@keyframes aviso-in { from { opacity:0; transform:translate(-50%, 16px); } to { opacity:1; transform:translate(-50%, 0); } }
@keyframes rebote { 0% { transform:scale(1); } 40% { transform:scale(.88); } 100% { transform:scale(1); } }

/* fill-mode backwards: el estado de reposo es siempre el visible */
.subir { animation:subir 400ms var(--ease-salida) backwards; animation-delay:calc(var(--i, 0) * 60ms); }
.subir-escala { animation:subir-escala 400ms var(--ease-salida) backwards; animation-delay:calc(var(--i, 0) * 60ms); }
.vista { animation:entrar-vista 300ms var(--ease-salida) backwards; }
.vapor path { fill:none; stroke:var(--espuma); stroke-width:5; stroke-linecap:round; opacity:0; animation:vapor 3.2s ease-in-out infinite; }
.vapor path:nth-child(2) { animation-delay:1s; }
.vapor path:nth-child(3) { animation-delay:2s; }

/* ---------- Botones y chips ---------- */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:var(--toque); padding:0 24px;
  border-radius:999px; border:0; background:var(--bogavante); color:#fff; font-weight:700; font-size:20px; text-decoration:none;
  transition:transform .15s var(--ease-salida), filter .15s; }
.btn:active { transform:scale(.97); }
.btn:disabled { opacity:.6; cursor:default; }
.btn-ancho { width:100%; }
.btn-sec { background:var(--mar-700); border:1px solid var(--mar-500); color:var(--espuma); }
.btn-icono { width:var(--toque); height:var(--toque); display:inline-flex; align-items:center; justify-content:center; border-radius:50%;
  background:transparent; border:1px solid var(--hierro-borde); color:var(--espuma); padding:0; }
.btn-icono svg { width:28px; height:28px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { display:inline-block; border-radius:999px; background:rgba(244,168,29,.12); color:var(--azafran-claro); font-size:15px; padding:4px 12px; line-height:1.4; }
.chip-manual { background:rgba(169,191,200,.12); color:var(--niebla); }

/* ---------- Portada ---------- */
.contenedor { max-width:var(--ancho); margin:0 auto; padding:0 var(--gutter); }
.heroe { text-align:center; padding-top:calc(24px + env(safe-area-inset-top)); padding-bottom:16px; }
.heroe-svg { width:100%; max-width:420px; height:auto; display:block; margin:0 auto; }
.titulo-marca { font-family:var(--fuente-display); font-weight:400; font-size:var(--t-hero); line-height:1; color:var(--azafran); margin-top:8px; overflow-wrap:anywhere; }
.lema { color:var(--niebla); max-width:30ch; margin:16px auto 0; font-size:var(--t-cuerpo); }
.rejilla { display:grid; grid-template-columns:1fr; gap:20px; padding:32px 0 24px; }
.tarjeta { position:relative; display:flex; flex-direction:column; gap:14px; padding:24px; text-decoration:none;
  background:var(--mar-800); border-radius:var(--radio-l); border:1px solid rgba(255,255,255,.06); box-shadow:var(--sombra);
  transition:transform .25s var(--ease-salida), border-color .25s; }
.tarjeta:active { transform:scale(.98); }
.tarjeta-mini { width:104px; height:104px; border-radius:50%; background:var(--hierro); border:1px solid var(--hierro-borde);
  display:flex; align-items:center; justify-content:center; transition:transform .25s var(--ease-salida); }
.tarjeta-mini svg { width:80px; height:80px; }
.tarjeta h2 { font-family:var(--fuente-display); font-weight:400; font-size:var(--t-h2); line-height:1.1; overflow-wrap:anywhere; }
.tarjeta p { color:var(--niebla); font-size:var(--t-peq); display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.tarjeta .flecha { position:absolute; right:22px; top:24px; width:32px; height:32px; color:var(--azafran); }
@media (hover:hover) {
  .tarjeta:not(.tarjeta-fantasma):hover { transform:translateY(-6px); border-color:var(--color-receta, var(--azafran)); }
  .tarjeta:not(.tarjeta-fantasma):hover .tarjeta-mini { transform:rotate(6deg); }
}
.tarjeta-fantasma { border:2px dashed var(--mar-500); background:transparent; box-shadow:none; align-items:center; justify-content:center; text-align:center; min-height:200px; color:var(--niebla); }
.tarjeta-fantasma h2 { font-size:22px; font-family:var(--fuente-texto); font-weight:700; }
.pie { text-align:center; color:var(--niebla); font-size:15px; padding:16px 0 calc(32px + env(safe-area-inset-bottom)); }
@media (min-width:640px) { .rejilla { grid-template-columns:repeat(2, 1fr); } }
@media (min-width:1000px) { .rejilla { grid-template-columns:repeat(3, 1fr); } }

/* ---------- Receta ---------- */
.receta { max-width:var(--ancho); margin:0 auto; padding:0 var(--gutter) 140px; }
.receta-cab { padding-top:calc(12px + env(safe-area-inset-top)); }
.volver { display:inline-flex; align-items:center; min-height:var(--toque); padding:0 8px; color:var(--azafran-claro); text-decoration:none; font-weight:700; font-size:20px; }
.receta-cab .ilu { width:100%; max-width:260px; height:auto; display:block; margin:8px 0; }
.receta-cab h1 { font-family:var(--fuente-display); font-weight:400; font-size:var(--t-h1); line-height:1.05; color:var(--azafran); overflow-wrap:anywhere; }
.subtitulo { color:var(--niebla); margin:12px 0 16px; max-width:var(--lectura); }
.receta-cols { display:grid; grid-template-columns:1fr; gap:20px; margin-top:24px; }
.receta-cols > * { min-width:0; }
.p-com { grid-area:com; } .p-ing { grid-area:ing; } .p-hor { grid-area:hor; }
.receta-cols { grid-template-areas:"com" "ing" "hor"; }
@media (min-width:1000px) { .receta-cols { grid-template-columns:1fr 1fr; grid-template-areas:"ing com" "ing hor"; grid-template-rows:auto 1fr; align-items:start; } }
.panel { background:var(--mar-800); border:1px solid rgba(255,255,255,.06); border-radius:var(--radio-l); padding:24px; box-shadow:var(--sombra); max-width:100%; }
.panel h2 { font-size:var(--t-h2); line-height:1.15; margin-bottom:12px; }
.etiqueta { color:var(--niebla); font-size:var(--t-peq); font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
.comensales { display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; }
.comensales-fila { display:flex; align-items:center; justify-content:center; gap:clamp(12px, 5vw, 32px); }
.stepper { width:var(--toque-grande); height:var(--toque-grande); flex:none; border-radius:50%; background:var(--hierro); border:1px solid var(--hierro-borde);
  display:inline-flex; align-items:center; justify-content:center; padding:0; color:var(--espuma); }
.stepper svg { width:28px; height:28px; }
.stepper.rebota { animation:rebote .3s var(--ease-rebote); }
.stepper:disabled { opacity:.35; cursor:default; }
.num-comensales { font-family:var(--fuente-num); font-variant-numeric:tabular-nums; font-size:clamp(56px, 16vw, 88px); line-height:1; min-width:1.6ch; font-weight:600; }
.aviso-muchos { margin-top:8px; padding:12px 16px; border-radius:var(--radio-s); background:rgba(244,168,29,.1); border-left:4px solid var(--azafran); font-size:var(--t-peq); text-align:left; }
.ing-seccion { margin-top:18px; }
.ing-seccion:first-of-type { margin-top:0; }
.ing-seccion h3 { color:var(--azafran); font-size:15px; font-variant:small-caps; letter-spacing:.1em; text-transform:lowercase; font-weight:700; margin-bottom:6px; border-bottom:1px solid rgba(255,255,255,.08); padding-bottom:4px; }
.ing-fila { display:grid; grid-template-columns:9.5rem minmax(0, 1fr); gap:10px; padding:8px 0; align-items:baseline; }
@media (max-width:480px) { .panel { padding:20px; } }
.cant { display:inline-block; overflow:hidden; white-space:nowrap; font-family:var(--fuente-num); font-variant-numeric:tabular-nums; font-size:20px; font-weight:600; vertical-align:bottom; }
.cant-in { display:inline-block; }
.cant-in.rueda-arriba { animation:rueda-arriba 320ms var(--ease-salida); }
.cant-in.rueda-abajo { animation:rueda-abajo 320ms var(--ease-salida); }
.ing-nombre { overflow-wrap:anywhere; }
.nota, .opc { color:var(--niebla); font-size:var(--t-peq); }
.acciones { margin-top:20px; }
.antes { margin-top:20px; }
.antes h3 { font-size:20px; margin-bottom:8px; }
.antes ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.antes li { position:relative; padding-left:26px; font-size:var(--t-peq); color:var(--espuma); }
.antes li::before { content:""; position:absolute; left:2px; top:.55em; width:10px; height:10px; border-radius:50%; background:var(--azafran); }
.segmentado { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:6px; background:var(--hierro); border-radius:999px; border:1px solid var(--hierro-borde); }
.segmentado button { min-height:var(--toque); border-radius:999px; border:0; background:transparent; color:var(--niebla); font-weight:700; font-size:17px; padding:0 8px; }
.segmentado button[aria-pressed="true"] { background:var(--azafran); color:#1b1303; }
.hora-input { margin-top:14px; width:100%; min-height:var(--toque); font-family:var(--fuente-num); font-size:28px; color:var(--espuma); background:var(--hierro); border:1px solid var(--hierro-borde); border-radius:var(--radio-m); padding:6px 16px; color-scheme:dark; }
.resumen-horario { margin-top:16px; font-size:20px; line-height:1.7; }
.resumen-horario b { font-family:var(--fuente-num); font-size:28px; color:var(--azafran-claro); font-weight:600; }
.no-llegas { margin-top:14px; padding:14px 16px; border-radius:var(--radio-s); background:rgba(255,122,89,.12); border-left:4px solid var(--coral); color:#ffd9cf; display:flex; flex-direction:column; gap:12px; align-items:flex-start; }
.pasos-sec { margin-top:40px; }
.pasos-sec > h2 { font-family:var(--fuente-display); font-weight:400; font-size:var(--t-h2); color:var(--azafran); }
.fase { margin-top:28px; }
.fase-cab { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px; }
.fase-cab h3 { font-size:24px; }
.linea { list-style:none; margin:16px 0 0; padding:0 0 0 28px; position:relative; max-width:var(--lectura); }
.linea::before { content:""; position:absolute; left:9px; top:8px; bottom:8px; width:2px; background:rgba(255,255,255,.14); }
.paso { position:relative; padding-bottom:32px; }
.paso::before { content:""; position:absolute; left:-28px; top:6px; width:20px; height:20px; border-radius:50%; background:var(--mar-900); border:4px solid var(--mar-500); }
.linea.ej .paso::before { border-color:var(--azafran); }
.paso-meta { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; }
.paso-hora { font-family:var(--fuente-num); font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
.paso-num { color:var(--niebla); font-size:var(--t-peq); font-weight:700; }
.paso h4 { margin:6px 0 4px; font-size:22px; font-weight:700; line-height:1.25; }
.paso p { font-size:clamp(18px, 4.6vw, 19px); line-height:1.55; }
.consejo { margin-top:12px; padding:12px 16px; background:rgba(244,168,29,.08); border-left:4px solid var(--azafran); border-radius:var(--radio-s); font-size:var(--t-peq); }
.consejo b { display:block; color:var(--azafran-claro); font-size:14px; letter-spacing:.06em; text-transform:uppercase; margin-bottom:2px; }
.barra-comenzar { position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; flex-direction:column; align-items:center; gap:6px;
  padding:12px var(--gutter) calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(to top, var(--mar-900) 70%, rgba(7,23,34,0)); }
.barra-comenzar .btn { width:100%; max-width:var(--lectura); min-height:64px; font-size:22px; }
.barra-comenzar small { color:var(--niebla); font-size:15px; }

/* ---------- Aviso ---------- */
.aviso { position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translate(-50%, 0); z-index:100; max-width:min(92vw, 520px);
  padding:14px 20px; border-radius:var(--radio-m); background:var(--hierro); border:1px solid var(--azafran); color:var(--espuma); font-size:var(--t-peq); text-align:center; box-shadow:var(--sombra); animation:aviso-in .3s var(--ease-salida) both; }

/* ---------- Modo cocina ---------- */
.cocina { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; background:var(--hierro); overflow:hidden; --glow:rgba(43,90,115,.55); }
.cocina.fase-ejecucion { --glow:rgba(226,73,47,.30); }
.cocina::before { content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(circle at 50% 30%, var(--glow), transparent 65%); }
.cocina > * { position:relative; }
.cocina-barra { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:calc(10px + env(safe-area-inset-top)) 12px 10px; }
.cocina-cuenta { display:flex; flex-direction:column; align-items:center; text-align:center; line-height:1.25; min-width:0; }
.cocina-cuenta span:first-child { font-weight:700; }
.cocina-cuenta span:last-child { color:var(--niebla); font-size:15px; }
.cocina-eta { font-size:15px; color:var(--niebla); text-align:center; line-height:1.25; }
.cocina-eta b { display:block; font-family:var(--fuente-num); color:var(--azafran-claro); font-size:20px; font-weight:600; }
.cocina-progreso { height:6px; background:rgba(255,255,255,.1); }
.cocina-progreso > div { height:100%; background:var(--azafran); transform-origin:left; transform:scaleX(0); }
.cocina-cuerpo { flex:1; overflow-y:auto; display:flex; flex-direction:column; align-items:center; gap:16px; padding:20px var(--gutter); text-align:center; }
.cocina-cuerpo > * { max-width:var(--lectura); width:100%; }
.anillo { position:relative; width:min(72vw, 40vh, 360px); aspect-ratio:1; flex:none; margin:0 auto; }
.anillo svg { width:100%; height:100%; display:block; }
.anillo-fondo { fill:none; stroke:rgba(255,255,255,.1); stroke-width:12; }
.anillo-arco { fill:none; stroke:var(--azafran); stroke-width:12; stroke-linecap:round; stroke-dasharray:565.49; stroke-dashoffset:0;
  transform:rotate(-90deg); transform-origin:50% 50%; transition:stroke-dashoffset 250ms linear; }
.anillo-arco.manual { stroke-dasharray:141.37 424.12; stroke-dashoffset:0; transition:none; animation:giro-manual 1.6s linear infinite; stroke:var(--oliva); }
.anillo.urgente { animation:pulso 1s ease-in-out infinite; }
.anillo.urgente .anillo-arco { stroke:var(--bogavante); }
.anillo-centro { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.reloj { font-family:var(--fuente-num); font-variant-numeric:tabular-nums; font-weight:600; font-size:clamp(56px, 18vw, 112px); line-height:1; }
.reloj.parpadea { animation:parpadeo 1.4s ease-in-out infinite; }
.reloj-sub { color:var(--niebla); font-size:var(--t-peq); margin-top:4px; }
#ck-titulo { font-weight:700; font-size:clamp(26px, 7vw, 40px); line-height:1.15; }
#ck-texto { font-size:clamp(20px, 5.2vw, 24px); line-height:1.5; }
#ck-titulo.entra, #ck-texto.entra { animation:entrar-paso 280ms var(--ease-salida) both; }
.cocina .consejo { text-align:left; }
.cocina-siguiente { color:var(--niebla); font-size:var(--t-peq); }
.cocina-controles { padding:12px var(--gutter) calc(14px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; background:linear-gradient(to top, var(--hierro) 80%, transparent); }
.fila-principal { display:grid; grid-template-columns:1fr 2fr 1fr; gap:10px; max-width:var(--lectura); width:100%; margin:0 auto; }
.fila-secundaria { display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:var(--lectura); width:100%; margin:0 auto; }
.btn-ctrl { min-height:64px; border-radius:var(--radio-m); border:1px solid var(--mar-500); background:var(--mar-700); color:var(--espuma); font-weight:700; font-size:18px; padding:0 8px; }
.btn-ctrl:active, .btn-sec2:active { transform:scale(.97); }
.btn-ctrl.btn-grande { min-height:72px; background:var(--bogavante); border-color:transparent; color:#fff; font-size:24px; }
.btn-ctrl.btn-grande.hecho { background:var(--oliva); color:#16200a; }
.btn-ctrl:disabled { opacity:.35; cursor:default; }
.cocina .btn-sec { min-height:var(--toque); border-radius:var(--radio-m); font-weight:700; font-size:17px; }
